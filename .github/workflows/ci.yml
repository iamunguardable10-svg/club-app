name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # The checks that used to run only locally: load maths, calendar files,
  # series, the access rules (all migrations on a plain Postgres), the data
  # layer against that database, and the Apple Calendar sync against a local
  # CalDAV server. Never against the Supabase project.
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (for the CalDAV server)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Load maths, calendar files, series
        run: |
          npm run test:load
          npm run test:calendar
          npm run test:series

      - name: Access rules (SQL)
        run: supabase/pilot/tests/run-local.sh

      - name: Data layer against the database
        run: npm run test:pilot

      - name: Start a local CalDAV server
        run: |
          pip install --quiet radicale
          mkdir -p /tmp/radicale/collections
          printf 'ben:secretpw\nmia:otherpw\n' > /tmp/radicale/users
          cat > /tmp/radicale/config <<'CONF'
          [server]
          hosts = 127.0.0.1:5232
          [auth]
          type = htpasswd
          htpasswd_filename = /tmp/radicale/users
          htpasswd_encryption = plain
          [storage]
          filesystem_folder = /tmp/radicale/collections
          [rights]
          type = owner_only
          CONF
          sed -i 's/^ *//' /tmp/radicale/config
          (python3 -m radicale --config /tmp/radicale/config > /tmp/radicale/log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5232/ && break; sleep 1; done

      - name: Apple Calendar sync against CalDAV
        run: npm run test:caldav
